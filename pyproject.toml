[project]
name = "smol-transformer-lab"
version = "0.1.0"
description = "Train and inspect tiny transformers in the browser"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "torch>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

